x-airflow-common: &airflow-common
  build: .
  image: crypto-medallion-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Copy .env.example to .env}@postgres-airflow:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set secret in .env}
    WAREHOUSE_HOST: postgres-warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: ${WAREHOUSE_DB:-crypto_dw}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-dw_user}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?Set password in .env}
    BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./dbt_project:/opt/airflow/dbt_project
    - airflow_logs:/opt/airflow/logs
  networks: [data-network]

services:
  postgres-airflow:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set password in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    networks: [data-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  postgres-warehouse:
    image: postgres:15-alpine
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-dw_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set password in .env}
      POSTGRES_DB: ${WAREHOUSE_DB:-crypto_dw}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./scripts/init_warehouse.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks: [data-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set admin password in .env}
    command: version
    depends_on:
      postgres-airflow:
        condition: service_healthy
      postgres-warehouse:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  warehouse_data:
  airflow_metadata:
  airflow_logs:

networks:
  data-network:
    driver: bridge
